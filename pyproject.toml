[project]
name = "study-graph"
version = "0.1.0"
description = "StudyGraph: LangGraph-based student exam prep assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.44.0",
    "langchain>=0.3.20",
    "langgraph>=0.3.20",
    "openai>=1.70.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studygraph"]

