[project]
name = "study-graph"
version = "0.1.0"
description = "StudyGraph: LangGraph-based student exam prep assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.44.0",
    "langchain>=0.3.20",
    "langgraph>=0.3.20",
    "openai>=1.70.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py311"
src = ["studygraph", "tests"]

[tool.ruff.lint]
# Start with Pyflakes + import/syntax errors; widen rules over time (see Ruff docs).
select = ["F", "E9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studygraph"]

# Non-Python package data used at runtime (YAML + injected CSS/HTML).
[tool.hatch.build.targets.wheel.force-include]
"studygraph/config/constants.yaml" = "studygraph/config/constants.yaml"
"studygraph/config/settings.yaml" = "studygraph/config/settings.yaml"
"studygraph/config/button_styles.css" = "studygraph/config/button_styles.css"
"studygraph/config/footer_snippet.html" = "studygraph/config/footer_snippet.html"

